name: Generate Release Keystore (one-time)

# Run this ONCE from the Actions tab ("Run workflow") to create the signing
# key that every future release build will reuse. Download the resulting
# "release-keystore" artifact, then add its contents + the three passwords
# below as repo secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  — the base64 file from the artifact
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS        — "relod"
#   RELEASE_KEY_PASSWORD
# Once those secrets are set, delete this workflow file — it must never run
# twice (a second key would break updates for anyone who already has the app).
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          KEYSTORE_PASS=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias relod \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -dname "CN=Relod, OU=Relod, O=Relod, L=Unknown, ST=Unknown, C=IN"
          base64 -w0 release.keystore > release.keystore.base64
          echo "Keystore password (save this as RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_PASSWORD): $KEYSTORE_PASS" > password.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore.base64
            password.txt
          retention-days: 7
