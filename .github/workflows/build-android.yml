name: Build Android APK

# Manual trigger (Actions tab → this workflow → "Run workflow"), plus
# automatic runs whenever anything under android/, capacitor.config.ts, or
# this workflow itself changes on main — everything else (regular frontend
# page edits) doesn't need a new APK build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No static export exists (this app is SSR) — the native shell just
      # points at the live deployed site. Debug builds point at the real
      # Vercel URL by default (see capacitor.config.ts); switch to
      # https://relod.in here once that domain's DNS is confirmed live.
      - name: Sync Capacitor
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: https://relod-frontend.vercel.app

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: relod-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
