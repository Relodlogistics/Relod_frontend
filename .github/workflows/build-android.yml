name: Build Android APK

# Manual trigger (Actions tab → this workflow → "Run workflow"), plus
# automatic runs whenever anything under android/, capacitor.config.ts, or
# this workflow itself changes on main — everything else (regular frontend
# page edits) doesn't need a new APK build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No static export exists (this app is SSR) — the native shell just
      # points at the live deployed site, now the branded relod.in domain
      # (DNS confirmed live and pointed at Vercel).
      - name: Sync Capacitor
        run: npx cap sync android
        env:
          # Must include /login — the bare domain serves the public marketing
          # landing page, not the app's actual entry point.
          CAPACITOR_SERVER_URL: https://relod.in/login

      # `if:` conditions can't reference `secrets` directly (GitHub disallows
      # it) — so the presence check happens in a plain step instead, exposed
      # as an output later steps can branch on.
      - name: Check for release keystore
        id: keystore_check
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "present=${{ env.RELEASE_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.keystore_check.outputs.present == 'true'
        working-directory: android/app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      # Signed release build once the keystore secret exists (see
      # generate-keystore.yml); every build after the first one MUST reuse
      # this same key or installs won't update in place. Falls back to an
      # unsigned debug build only until that one-time setup is done.
      - name: Build APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.keystore_check.outputs.present }}" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        if: steps.keystore_check.outputs.present == 'true'
        with:
          name: relod-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: steps.keystore_check.outputs.present != 'true'
        with:
          name: relod-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publishes the signed APK to a URL end users can actually reach.
      # public/ is served as static files by the Next.js/Vercel deploy of
      # this same repo, so this file becomes downloadable at
      # https://relod-frontend.vercel.app/downloads/relod-latest.apk within
      # a normal Vercel deploy cycle after this push — no separate hosting
      # needed. Skipped for unsigned debug builds (those are for local
      # testing only, never for real users).
      - name: Publish APK for in-app updates
        if: steps.keystore_check.outputs.present == 'true'
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/relod-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/relod-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest signed APK for in-app updates [skip ci]"
            git push
          fi
